name: Temporary red build of pull request 43 with a data set release left out

on:
  push:
    branches:
      - 'tmp/red-43b'

jobs:
  Build:
    uses: 51Degrees/common-ci/.github/workflows/nightly-pull-request.yml@main
    with:
      repo-name: 51degrees-varnish
      org-name: 51Degrees
      pull-request-id: 0
      dryrun: 'true'
      branch: tmp/red-43b
      skip-compare-performance: true
