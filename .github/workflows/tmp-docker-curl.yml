name: Temporary check of the Docker example

on:
  push:
    branches:
      - 'tmp/docker-curl-31'

jobs:
  Check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Build the image as the README says
        working-directory: examples/curl
        run: docker build -t 51d-varnish-curl .

      - name: Report the Varnish version in the image
        run: docker run --rm 51d-varnish-curl varnishd -V

      - name: Run the image as the README says
        run: docker run -d -p 8080:8080 --name curl-example 51d-varnish-curl

      - name: Wait for the example to answer
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null "http://127.0.0.1:8080/"; then
              echo "Answered after $i tries"
              exit 0
            fi
            sleep 2
          done
          echo "No answer after 120 seconds"
          exit 1

      - name: Send the README's request
        run: |
          curl --head -H 'X-Real-IP: 212.58.224.22' \
               -H 'User-Agent: Mozilla/5.0 (iPhone; CPU iPhone OS 7_1 like Mac OS X) AppleWebKit/537.51.2 (KHTML, like Gecko) Version/7.0 Mobile/11D167 Safari/9537.53' \
               http://127.0.0.1:8080/ | tee headers.txt
          echo "Checking the two values the README names:"
          grep -iF 'x-is-mobile: True' headers.txt
          grep -iF 'x-asn: \"BBC\":1' headers.txt

      - name: Run curl.sh
        working-directory: examples/curl
        run: sh ./curl.sh

      - name: Show the container's log
        if: always()
        run: docker logs curl-example 2>&1 | tail -50 || true
