name: Docker example

# Builds the curl example's Docker image from the commit this run checks out,
# which for a pull request is the pull request merged into its base, starts it
# as the example's README does, and checks the README's request and curl.sh.
# It runs when a pull request changes the example or what the image builds.
on:
  pull_request:
    paths:
      - 'examples/curl/**'
      - 'src/**'
      - 'autogen.sh'
      - 'configure.ac'
      - 'Makefile.am'
      - 'cxx'
      - '.github/workflows/docker-example.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-example:
    name: Docker example
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Build the image from this run's commit
        working-directory: examples/curl
        run: docker build --build-arg "_51DEGREES_REPOSITORY=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --build-arg "_51DEGREES_COMMIT=$GITHUB_SHA" -t 51d-varnish-curl .

      - name: Check the image holds this run's commit
        run: |
          built=$(docker run --rm 51d-varnish-curl git -C /app rev-parse HEAD)
          echo "The image built $built, and this run checked out $GITHUB_SHA"
          test "$built" = "$GITHUB_SHA"

      - name: Start the image as the README says
        run: docker run -d -p 8080:8080 --name curl-example 51d-varnish-curl

      - name: Wait for the example to answer
        run: |
          for i in $(seq 1 120); do
            if curl -s -o /dev/null "http://127.0.0.1:8080/"; then
              echo "Answered after $i seconds"
              exit 0
            fi
            sleep 1
          done
          echo "::error::The example did not answer within 120 seconds"
          exit 1

      - name: Send the README's request
        run: |
          curl -sS --head -H 'X-Real-IP: 212.58.224.22' \
               -H 'User-Agent: Mozilla/5.0 (iPhone; CPU iPhone OS 7_1 like Mac OS X) AppleWebKit/537.51.2 (KHTML, like Gecko) Version/7.0 Mobile/11D167 Safari/9537.53' \
               http://127.0.0.1:8080/ | tee headers.txt
          grep -q '^HTTP/1.1 200 OK' headers.txt
          grep -qiF 'x-is-mobile: True' headers.txt
          grep -qiF 'x-asn: \"BBC\":1' headers.txt
          grep -qi '^x-find-out-more: ' headers.txt

      - name: Run curl.sh
        working-directory: examples/curl
        run: |
          sh ./curl.sh | tee curl-sh.txt
          test "$(grep -c '^HTTP/1.1 200 OK' curl-sh.txt)" = 3

      - name: Show the container's log
        if: always()
        run: docker logs curl-example 2>&1 | tail -50 || true
